services:
  - type: web
    name: valen-boxing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: /var/data/videos
      - key: REPORTS_DIR
        value: /var/data/reports
      - key: MAX_UPLOAD_BYTES
        value: "2147483648"
